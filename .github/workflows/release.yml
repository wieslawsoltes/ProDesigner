name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Directory.Build.props']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext(".//Version"))')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "${GITHUB_REF_NAME#v}" = "$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
  packages:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: |
          dotnet build ProDesigner.slnx -c Release
          dotnet test tests/ProDesigner.Tests -c Release --no-build
      - name: Pack libraries and complete source
        shell: bash
        run: |
          mkdir -p artifacts/packages
          for project in src/*/*.csproj; do dotnet pack "$project" -c Release --no-build -o artifacts/packages; done
          tar --exclude=.git --exclude='*/.git' --exclude='*/bin' --exclude='*/obj' --exclude='*/TestResults' --exclude=artifacts -czf artifacts/prodesigner-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/
  desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish apps/ProDesigner.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/
  browser:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet workload install wasm-tools
      - run: dotnet publish apps/ProDesigner.Browser -c Release -o artifacts/browser
      - name: Prepare browser distribution
        run: |
          mkdir -p artifacts/site
          ROOT=$(find artifacts/browser -type f -path '*/wwwroot/index.html' -print -quit)
          test -n "$ROOT"
          cp -a "$(dirname "$ROOT")/." artifacts/site/
          touch artifacts/site/.nojekyll
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test
        working-directory: tests/browser
      - run: tar -czf artifacts/prodesigner-web.tar.gz -C artifacts/site .
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: artifacts/prodesigner-web.tar.gz
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, packages, desktop, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Archive desktop distributions and checksum downloads
        run: |
          for rid in win-x64 linux-x64 osx-arm64; do tar -czf "artifacts/prodesigner-$rid.tar.gz" -C artifacts "$rid"; done
          (cd artifacts && sha256sum *.tar.gz packages/*.nupkg > SHA256SUMS.txt)
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists; published assets are not overwritten.'
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes "${FLAGS[@]}" artifacts/*.tar.gz artifacts/SHA256SUMS.txt artifacts/packages/*.nupkg
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish configured NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$NUGET_API_KEY" ]]; then
            dotnet nuget push 'artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          else
            echo 'NuGet registry publishing skipped: NUGET_API_KEY is not configured. Packages are attached to the GitHub release.'
          fi
