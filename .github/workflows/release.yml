name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: |
          dotnet build ProDesigner.slnx -c Release
          dotnet test tests/ProDesigner.Tests -c Release --no-build
      - name: Pack
        shell: bash
        run: |
          VERSION=0.1.0-alpha.1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          mkdir -p artifacts/packages
          for project in src/*/*.csproj; do dotnet pack "$project" -c Release -p:Version="$VERSION" -o artifacts/packages; done
          tar --exclude=.git --exclude='*/.git' --exclude='*/bin' --exclude='*/obj' --exclude=artifacts -czf artifacts/prodesigner-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish apps/ProDesigner.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Archive desktop distributions
        run: |
          for rid in win-x64 linux-x64 osx-arm64; do tar -czf "artifacts/prodesigner-$rid.tar.gz" -C artifacts "$rid"; done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes artifacts/*.tar.gz artifacts/packages/*.nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish configured NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$NUGET_API_KEY" ]]; then
            dotnet nuget push 'artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          else
            echo 'NuGet publishing skipped: NUGET_API_KEY is not configured. Packages are attached to the release.'
          fi
