name: Integrate refactoring and component namespace context
on:
  push:
    branches: [feat/components-prototyping-refactoring]
    paths: ['.github/workflows/integrate-refactoring.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/ProDesigner' && github.ref == 'refs/heads/feat/components-prototyping-refactoring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Integrate exact source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pending = {}
          def replace(path, old, new, count=1):
              source = pending.get(path, Path(path).read_text(encoding='utf-8'))
              if source.count(old) != count: raise RuntimeError('Unexpected integration anchor: ' + path + ': ' + old[:90])
              pending[path] = source.replace(old, new)
          workspace = 'src/ProDesigner.Workspaces/SolutionWorkspace.cs'
          replace(workspace, 'public sealed class SolutionWorkspace : IWorkspaceService', 'public sealed partial class SolutionWorkspace : IWorkspaceService')
          replace(workspace, 'public Solution? Solution => _workspace?.CurrentSolution;', 'public Solution? Solution => _refactoringSnapshot ?? _workspace?.CurrentSolution;')
          replace(workspace, '_workspace?.Dispose(); _diagnostics.Clear();', '_workspace?.Dispose(); _refactoringSnapshot = null; _diagnostics.Clear();')
          replace(workspace, 'foreach (var project in _workspace.CurrentSolution.Projects)', 'foreach (var project in Solution!.Projects)')
          replace(workspace, 'var project = _workspace?.CurrentSolution.Projects.FirstOrDefault', 'var project = Solution?.Projects.FirstOrDefault', 2)
          commands = 'src/ProDesigner.Workbench/DesignerCommands.cs'
          replace(commands, 'case "constraints": ShowConstraintTools(); break;', 'case "constraints": ShowConstraintTools(); break;\n            case "refactor": ShowProjectRefactoring(); break;\n            case "refactor-undo": _ = UndoRenameFromUiAsync(); break;')
          replace(commands, '["Components and variants"] = ShowComponentTools,', '["Project-aware XAML / C# rename"] = ShowProjectRefactoring, ["Undo last project rename"] = () => _ = UndoRenameFromUiAsync(),\n            ["Components and variants"] = ShowComponentTools,')
          component = 'src/ProDesigner.DesignSystems/ComponentModel.cs'
          replace(component, 'ComponentOverride[] Overrides, long AppliedRevision, string Baseline);', 'ComponentOverride[] Overrides, long AppliedRevision, string Baseline, Dictionary<string, string>? NamespaceContext = null);')
          replace(component, 'public sealed record ComponentUpdate(string InstanceId, string DocumentId, TextEdit Edit, ComponentInstance UpdatedInstance);', 'public sealed record ComponentUpdate(string InstanceId, string DocumentId, TextEdit Edit, ComponentInstance UpdatedInstance, TextEdit[]? NamespaceEdits = null);')
          replace(component, 'return new(instance.Id, instance.DocumentId, new(node.Span, rendered, current), instance with { Baseline = rendered, AppliedRevision = definition.Revision });', '''var imported = FragmentImporter.Prepare(document, node.Parent ?? document.Root, rendered);
                  return new(instance.Id, instance.DocumentId, new(node.Span, imported.Source, current),
                      instance with { Baseline = imported.Source, AppliedRevision = definition.Revision, NamespaceContext = new(imported.Namespaces) }, imported.RootEdits.ToArray());''')
          replace(component, 'XmlConvert.VerifyNCName(instance.RootName); XamlSyntaxTree.Parse(instance.Baseline);', 'XmlConvert.VerifyNCName(instance.RootName); ValidateBaseline(instance);')
          replace(component, '    private static XamlElement ResolveTarget(', '''    private static void ValidateBaseline(ComponentInstance instance)
              {
                  if (instance.NamespaceContext is null) { XamlSyntaxTree.Parse(instance.Baseline); return; }
                  if (instance.NamespaceContext.Count > 256) throw new InvalidDataException("Too many instance namespace aliases.");
                  foreach (var pair in instance.NamespaceContext)
                  {
                      XmlConvert.VerifyName(pair.Key);
                      if ((pair.Key != "xmlns" && !pair.Key.StartsWith("xmlns:", StringComparison.Ordinal)) || pair.Value is null)
                          throw new InvalidDataException("Invalid instance namespace context.");
                  }
                  var aliases = string.Join(" ", instance.NamespaceContext.Select(p => $"{p.Key}=\\"{XamlEdits.Escape(p.Value)}\\""));
                  var tree = XamlSyntaxTree.Parse($"<Fragment {aliases}>{instance.Baseline}</Fragment>");
                  if (tree.Root.Children.Count != 1) throw new InvalidDataException("An instance baseline must contain one root element.");
              }
              private static XamlElement ResolveTarget(''')
          tools = 'src/ProDesigner.Workbench/ComponentTools.cs'
          replace(tools, 'instance = instance with { Baseline = source.Substring(root.Span.Start, root.Span.Length) };', 'instance = instance with { Baseline = source.Substring(root.Span.Start, root.Span.Length), NamespaceContext = new(XamlNames.Namespaces(root)) };')
          replace(tools, 'EditApplication.Apply(document.Session.Source, g.Select(u => u.Edit))', 'EditApplication.Apply(document.Session.Source, g.SelectMany(u => u.NamespaceEdits ?? []).Distinct().Concat(g.Select(u => u.Edit)))')
          replace(tools, 'EditApplication.Apply(document.Session.Source, [update.Edit])', 'EditApplication.Apply(document.Session.Source, (update.NamespaceEdits ?? []).Concat([update.Edit]))')
          for path, content in pending.items(): Path(path).write_text(content, encoding='utf-8', newline='')
          print('Preflighted and integrated', len(pending), 'source files.')
          PY
      - name: Commit integrated source to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: preserve linked instance namespace context and integrate project refactoring'
          git push origin HEAD:refs/heads/feat/components-prototyping-refactoring
