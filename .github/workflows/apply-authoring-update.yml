name: Apply verified authoring update
on:
  push:
    branches: [feat/prodesigner-studio]
    paths: ['.prodesigner-transfer/**', '.github/workflows/apply-authoring-update.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProDesigner' && github.ref == 'refs/heads/feat/prodesigner-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and materialize locally tested source transactions
        shell: bash
        run: |
          git merge-base --is-ancestor 7c42a200570d65a400a985c59b258882a2f7502e HEAD
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          pending = {}
          for manifest in sorted(root.glob('.prodesigner-transfer/*.json')):
              for item in json.loads(manifest.read_text(encoding='utf-8')):
                  relative = pathlib.PurePosixPath(item['path'])
                  if relative.is_absolute() or '..' in relative.parts or relative.parts[0].startswith('.'):
                      raise RuntimeError('Invalid source path')
                  if relative.parts[0] not in {'src','apps','tests','docs','ProDesigner.slnx','README.md','SECURITY.md','THIRD-PARTY-NOTICES.md'}:
                      raise RuntimeError('Source path is outside this update')
                  target = root.joinpath(*relative.parts)
                  before = target.read_text(encoding='utf-8') if target.exists() else ''
                  digest = lambda text: hashlib.sha256(text.encode('utf-8')).hexdigest()
                  if digest(before) != item['before']:
                      raise RuntimeError('Base checksum mismatch: ' + item['path'])
                  edits = sorted(item['edits'], key=lambda edit: edit[0])
                  cursor = 0
                  for offset, length, replacement in edits:
                      if offset < cursor or length < 0 or offset + length > len(before):
                          raise RuntimeError('Invalid or overlapping edit')
                      cursor = offset + length
                  after = before
                  for offset, length, replacement in reversed(edits):
                      after = after[:offset] + replacement + after[offset+length:]
                  if digest(after) != item['after']:
                      raise RuntimeError('Result checksum mismatch: ' + item['path'])
                  if item['path'] in pending:
                      raise RuntimeError('Duplicate source file')
                  pending[item['path']] = after
          if len(pending) != 46:
              raise RuntimeError('Incomplete source transfer')
          for relative, source in pending.items():
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(source, encoding='utf-8', newline='')
          subprocess.run(['git','add','--',*pending.keys()],check=True)
          print('Verified all 46 source-file checksums before staging.')
          PY
      - name: Commit only to the existing feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: compile project previews, bind XAML symbols, and expand tested authoring tools'
          git push origin HEAD:refs/heads/feat/prodesigner-studio
