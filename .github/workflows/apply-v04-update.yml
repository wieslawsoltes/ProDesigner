name: Apply locally verified v04 source update
on:
  push:
    branches: [feat/embedded-preview-vector-parity]
    paths: ['.prodesigner-transfer/**', '.github/workflows/apply-v04-update.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/ProDesigner' && github.ref == 'refs/heads/feat/embedded-preview-vector-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify every source precondition before materialization
        shell: bash
        run: |
          git merge-base --is-ancestor 93afd2584009b97b80bc51298ea9ac42221c509c HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          hashes = '''0e594f7f946d3d7a151fba7baea9ccd10773cf5a478d02e2e0d278fa882ac7fb
          3e79dae3a388abaf1e85ed6ffa60a7c06b1a93aeae8a96fcc60b8c8841d1d780
          a3f10898b7b69b3c4ee611f551594e418c61ee172024daafcdc1372bff65bb3f
          e5fed630fa412d8f98c23a7d242a1af1eb00b9f44a4ebcd291210d3c748b30e7
          55a4e192e57ac01719058c1009edec4abc6ae3a1c454f6c39edc71657674279f
          f69a2ff579cbcd9487a927ee63f1aca268d48a68556bacd478801b95026cb426
          83783ab820ae484afbcb515134e4d94207bdce3224a3c0e82d9e6a2b91ef1ca0
          12e54264fbae9c45759618df6486b7140afc0add6db0f589c5100e707cbe7784
          5de7d5a25706ad7570258e6c3cc4813fa69d45a20463e9134be93a6d985c927e
          186a43e1df298b11fd0a29dd1ebc78b005e53f75fba30aa8dc055905fdda7af3
          8d13207affd7e3c8520f11ba07778728fa23feec6066d9f8d38522848e95fb20
          6f06976a1e19e99b939c87a07891a3edaf5deb967d8d8affd7fb466e736b460f
          07eac19c8be3a315b4ef69bb4d13b7c5757fa953b399f24e055227e5862d15f8
          b0379e9aa224f7153d92063c51317450f35015bce7af551d28febce143316fa2
          54498d0cb5fd4df3ea68ca75bd580b4f5fac7d081ca709793bfbb8498007cc1c
          2ff9ae28852db5f679cafbc9bc5487312e4daa1e35ed0868a7996bf2713b588d
          f0266ed078e35184f90c73d5e17e0a4618eb3b61365c8812dc6b54a68516ee19
          9ea9e85fe749e69ce87cca137987aa6e7769f52f24a80e6d8259858dd6036fa1'''.split()
          digest = lambda data: hashlib.sha256(data).hexdigest()
          chunks = []
          bad = []
          for index, expected in enumerate(hashes):
              path = root / f'.prodesigner-transfer/{index:02}.b64'
              chunk = ''.join(path.read_text(encoding='ascii').split())
              if index == 16:
                  tail = ''.join((root / '.prodesigner-transfer/16-tail.b64').read_text(encoding='ascii').split())
                  chunk = chunk[:3000] + tail
              actual = digest(chunk.encode('ascii'))
              if actual != expected:
                  print('CORRUPT TRANSFER CHUNK', index, 'length', len(chunk), 'sha256', actual)
                  bad.append(index)
              chunks.append(chunk)
          if bad:
              raise RuntimeError('No source files changed. Repair transfer chunks: ' + str(bad))
          encoded = ''.join(chunks)
          if len(encoded) != 68200: raise RuntimeError('Unexpected payload size')
          compressed = base64.b64decode(encoded, validate=True)
          if digest(compressed) != 'e466d4eed2bb8a20584b223f94a38d5e646d81bb669d17aa18ac192ed8114674':
              raise RuntimeError('Payload integrity failure')
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              payload = stream.read(1048577)
          if len(payload) > 1048576: raise RuntimeError('Oversized payload')
          items = json.loads(payload)
          if len(items) != 51: raise RuntimeError('Incomplete update')
          pending = {}
          allowed = {'src','apps','tests','docs','ProDesigner.slnx','Directory.Build.props','README.md','CHANGELOG.md','SECURITY.md'}
          for item in items:
              relative = pathlib.PurePosixPath(item['path'])
              if relative.is_absolute() or '..' in relative.parts or relative.parts[0] not in allowed:
                  raise RuntimeError('Unapproved source path')
              if item['path'] in pending: raise RuntimeError('Duplicate source path')
              target = root.joinpath(*relative.parts)
              before = target.read_bytes().decode('utf-8') if target.exists() else ''
              if digest(before.encode('utf-8')) != item['before']:
                  raise RuntimeError('Base checksum mismatch: ' + item['path'])
              edits = sorted(item['edits'], key=lambda e: e[0])
              cursor = 0
              for start, length, replacement in edits:
                  if start < cursor or length < 0 or start + length > len(before):
                      raise RuntimeError('Invalid or overlapping source edit')
                  cursor = start + length
              after = before
              for start, length, replacement in reversed(edits):
                  after = after[:start] + replacement + after[start+length:]
              if digest(after.encode('utf-8')) != item['after']:
                  raise RuntimeError('Result checksum mismatch: ' + item['path'])
              pending[item['path']] = after
          for path, source in pending.items():
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source.encode('utf-8'))
          subprocess.run(['git','add','--',*pending.keys()],check=True)
          print('All 51 source files match the locally validated result checksums.')
          PY
      - name: Commit the verified implementation to the existing feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: embedded runtime artboards, complete path grammar, journal recovery and incremental editing'
          git push origin HEAD:refs/heads/feat/embedded-preview-vector-parity
