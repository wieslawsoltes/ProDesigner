name: Offline validation kit
on:
  workflow_dispatch:
  push:
    branches: [feat/prodesigner-studio]
    paths: ['.github/workflows/offline-validation.yml']
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: /tmp/prodesigner-packages
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore isolated public dependencies
        run: dotnet restore ProDesigner.slnx --source https://api.nuget.org/v3/index.json
      - name: Prepare independently downloadable validation archives
        run: |
          mkdir -p /tmp/prodesigner-validation
          VERSION=$(dotnet --version)
          curl --fail --location --retry 3 "https://builds.dotnet.microsoft.com/dotnet/Sdk/$VERSION/dotnet-sdk-$VERSION-linux-x64.tar.gz" -o /tmp/prodesigner-validation/dotnet-sdk-linux-x64.tar.gz
          tar -czf /tmp/prodesigner-validation/packages.tar.gz -C "$NUGET_PACKAGES" .
          split -b 350M /tmp/prodesigner-validation/packages.tar.gz /tmp/prodesigner-validation/packages.part-
          dotnet --info > /tmp/prodesigner-validation/toolchain.txt
          sha256sum /tmp/prodesigner-validation/*.tar.gz > /tmp/prodesigner-validation/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: offline-sdk
          path: |
            /tmp/prodesigner-validation/dotnet-sdk-linux-x64.tar.gz
            /tmp/prodesigner-validation/toolchain.txt
            /tmp/prodesigner-validation/checksums.txt
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: offline-packages-aa
          path: /tmp/prodesigner-validation/packages.part-aa
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: offline-packages-ab
          path: /tmp/prodesigner-validation/packages.part-ab
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: offline-packages-ac
          path: /tmp/prodesigner-validation/packages.part-ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
