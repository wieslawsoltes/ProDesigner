name: Publish browser to Pages
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet workload install wasm-tools
      - run: dotnet publish apps/ProDesigner.Browser -c Release -o artifacts/browser
      - name: Prepare site
        run: |
          mkdir -p artifacts/site
          ROOT=$(find artifacts/browser -type f -path '*/wwwroot/index.html' -print -quit)
          test -n "$ROOT"
          cp -a "$(dirname "$ROOT")/." artifacts/site/
          touch artifacts/site/.nojekyll
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test
        working-directory: tests/browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
